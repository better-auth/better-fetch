output:
  - success
  - failure

pre-commit:
  parallel: true
  commands:
    biome:
      run: pnpm biome check --apply --error-on-warnings --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true
    lockfile:
      glob: "{package.json,pnpm-lock.yaml,pnpm-workspace.yaml,packages/*/package.json}"
      run: pnpm install --frozen-lockfile --ignore-scripts

pre-push:
  commands:
    typecheck:
      run: pnpm typecheck
