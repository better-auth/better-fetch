name: Lint GitHub Actions

on:
  pull_request:
    paths:
      - ".github/actions/**"
      - ".github/workflows/**"
      - ".github/zizmor.yml"
  push:
    branches: [main]
    paths:
      - ".github/actions/**"
      - ".github/workflows/**"
      - ".github/zizmor.yml"

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    uses: better-auth/shared-workflows/.github/workflows/lint-github-actions.yml@93cb569f835297529614ed443414b4a372d2dd7b

  zizmor:
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
    uses: better-auth/shared-workflows/.github/workflows/zizmor.yml@93cb569f835297529614ed443414b4a372d2dd7b

  zizmor-code-scanning:
    if: github.event_name == 'push'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: better-auth/shared-workflows/.github/workflows/zizmor-code-scanning.yml@93cb569f835297529614ed443414b4a372d2dd7b
